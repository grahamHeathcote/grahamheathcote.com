<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#bcd3e0;--ink:#2e3d43;--panel:#ffffffa6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1018;--ink:#b9d0d6;--panel:#0b131b99}}
:root[data-theme="dark"]{--bg:#0a1018;--ink:#b9d0d6;--panel:#0b131b99}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);overflow:hidden;font:500 15px/1.4 Figtree,"Segoe UI",system-ui,sans-serif}
main{position:relative;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
canvas:focus-visible{box-shadow:inset 0 0 0 3px var(--ink)}
#nojs{position:fixed;inset:0;z-index:9;display:grid;place-items:center;padding:24px;text-align:center;font-size:17px;background:var(--bg)}
#hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);margin:0;padding:6px 14px;border-radius:999px;background:var(--panel);text-align:center;pointer-events:none;transition:opacity 1s}
.ctl{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateX(-50%);padding:2px 6px;border-radius:22px;background:var(--panel);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.row{display:flex;align-items:center}
.row button{width:36px;height:36px;padding:0;border:0;border-radius:50%;background:none;color:inherit;cursor:pointer;display:grid;place-items:center}
.row :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input{-webkit-appearance:none;appearance:none;width:min(230px,48vw);height:6px;margin:0 6px;border-radius:3px;cursor:pointer}
#t{background:linear-gradient(90deg,#8fd6e4,#f4a261 50%,#23315a)}
#v{background:linear-gradient(90deg,#8c9aa1,#dde5e8)}
#g{background:linear-gradient(90deg,#9aa3a6 0 24%,transparent 24% 26%,#b4bdc0 26% 49%,transparent 49% 51%,#ccd4d6 51% 74%,transparent 74% 76%,#e2e8ea 76%)}
input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #3b4a4f;box-shadow:0 1px 4px #0005}
input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #3b4a4f;box-shadow:0 1px 4px #0005}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<main><canvas id="c" tabindex="0" role="img" aria-label="A 3D swimming pool with floating toys: a lounge chair, a donut ring, two noodles and a beach ball. Drag a toy to move it, or tap the water to splash. With a keyboard, press Space to pick a toy and the arrow keys to push it."></canvas></main>
<div id="nojs"><p>This pool only runs in a web browser.<br>The phone's file preview can't play it, so ask whoever sent it for a link.</p></div>
<p id="hint">Drag the toys around. Tap the water to splash.</p>
<div class="ctl">
 <div class="row">
  <button id="toSide" aria-label="Poolside view"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2 7.5h16"/><path d="M2 13c2-1.6 3-1.6 4 0s3 1.6 4 0 3-1.6 4 0 2 1.6 4 0"/></svg></button>
  <input id="v" type="range" min="0" max="1" step="0.001" value="0.45" aria-label="View angle, from poolside to overhead">
  <button id="toTop" aria-label="Overhead view"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="4.5" width="14" height="11" rx="1.5"/><path d="M6 8.2h8M6 11.8h8"/></svg></button>
 </div>
 <div class="row">
  <button id="toLow" aria-label="Lowest graphics (fastest)"><svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><rect x="4" y="4" width="5" height="5" rx=".6"/><rect x="11" y="4" width="5" height="5" rx=".6" opacity=".45"/><rect x="4" y="11" width="5" height="5" rx=".6" opacity=".45"/><rect x="11" y="11" width="5" height="5" rx=".6"/></svg></button>
  <input id="g" type="range" min="0" max="3" step="1" value="3" aria-label="Graphics quality">
  <button id="toHigh" aria-label="Highest graphics"><svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M10 2.5l1.7 5.8 5.8 1.7-5.8 1.7L10 17.5l-1.7-5.8L2.5 10l5.8-1.7z"/></svg></button>
 </div>
 <div class="row">
  <button id="toDay" aria-label="Go to midday"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10" cy="10" r="3.6"/><path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4"/></svg></button>
  <input id="t" type="range" min="0" max="1" step="0.001" value="0" aria-label="Time of day">
  <button id="toNight" aria-label="Go to night"><svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M16.4 12.4A7 7 0 1 1 7.6 3.6a5.6 5.6 0 0 0 8.8 8.8z"/></svg></button>
 </div>
</div>
<script>
document.getElementById('nojs').remove();
const $=id=>document.getElementById(id),cv=$('c'),hint=$('hint'),T=$('t'),VW=$('v'),GQ=$('g'),
 still=matchMedia('(prefers-reduced-motion: reduce)'),tol=matchMedia('(pointer:coarse)').matches?4:1.5;
if(!window.THREE){hint.textContent='The 3D engine didn\u2019t load. Check your connection and reload.';throw new Error('three.js did not load')}

// ---------- helpers ----------
const len=(x,y)=>Math.sqrt(x*x+y*y),clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),ss=(a,b,x)=>(x=clamp((x-a)/(b-a),0,1),x*x*(3-2*x)),
 seg=(x,y,ax,ay,bx,by)=>{const dx=bx-ax,dy=by-ay,k=clamp(((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy),0,1);return len(x-ax-dx*k,y-ay-dy*k)},
 tube=(d,r)=>1-ss(r-2.5,r+2,d);

// ---------- world: water grid is gw×gh cells of 4 cm. Grid x → world x, grid y → world −z (metres, deck at y=0) ----------
const gw=300,gh=180,CELL=.04,PL=gw*CELL,PW=gh*CELL,WY=-.15,HS=.3,CW=.34,
 G2W=(gx,gy)=>[(gx-gw/2)*CELL,-(gy-gh/2)*CELL],W2G=(x,z)=>[x/CELL+gw/2,-z/CELL+gh/2];
// Work skipping: waterDirty = the water changed since it was last sent to the GPU; waterFlat = it has settled to
// nothing visible; dirty = something on screen changed, so the next frame must be drawn.
let waterDirty=true,waterFlat=false,dirty=true;
const wake=()=>{waterDirty=true;waterFlat=false;dirty=true};
const A=new Float32Array(gw*gh),V=new Float32Array(gw*gh),px=new Uint8ClampedArray(gw*gh*4),sc=document.createElement('canvas'),sx=sc.getContext('2d');
sc.width=gw;sc.height=gh;

// ---------- toys: physics shape in grid cells (cs = collision circles, fp = how deep each spot sits), plus a 3D model ----------
const TUBES=[[-19,-16,-19,16,4.6],[-19,-16,17,-16,4.2],[-19,16,17,16,4.2],[19,-11,19,11,2.8]],SPR=['#ffffff','#ffd23f','#3ec9c0','#6b5bd6','#ff5a4f'];
const Y=new THREE.Vector3(0,1,0),std=(c,r=.4)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:0}),
 lv=(x,y,h=0)=>new THREE.Vector3(x*CELL,h,-y*CELL),mesh=(g,m,p)=>{const o=new THREE.Mesh(g,m);if(p)o.position.copy(p);return o};
function capsule(ax,ay,bx,by,r,mat){
 const g=new THREE.Group(),a=lv(ax,ay),b=lv(bx,by),d=b.clone().sub(a),R=r*CELL;
 const c=mesh(new THREE.CylinderGeometry(R,R,d.length(),24,1,true),mat,a.clone().add(b).multiplyScalar(.5));
 c.quaternion.setFromUnitVectors(Y,d.normalize());g.add(c);
 for(const p of[a,b])g.add(mesh(new THREE.SphereGeometry(R,24,12),mat,p));
 return g;
}
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'));return new THREE.CanvasTexture(c)}
const ball={cs:[[0,0,8]],R:9,pu:1.35,ρ:.1,d:.5,lift:.24,roll:true,dip:.3,dipSil:g=>g.arc(0,0,5,0,7),fp:(x,y)=>1-ss(2,6,len(x,y)),
 sil:g=>g.arc(0,0,8,0,7),
 mk(){const tx=canvasTex(512,256,g=>{['#e63e36','#fff','#2d6fd8','#fff','#f6c22e','#fff'].forEach((f,i)=>{g.fillStyle=f;g.fillRect(i*512/6,0,512/6+1,256)});g.fillStyle='#fff';g.fillRect(0,0,512,24);g.fillRect(0,232,512,24)});
  const m=mesh(new THREE.SphereGeometry(8*CELL,48,24),new THREE.MeshStandardMaterial({map:tx,roughness:.28}));const g=new THREE.Group();g.add(m);return g}};
const ring={cs:[[0,0,16]],R:17,pu:1.2,ρ:.22,d:.7,lift:.07,dip:.5,fp:(x,y)=>tube(Math.abs(len(x,y)-11.25),4.75),
 sil:g=>{g.arc(0,0,16,0,7);g.moveTo(6.5,0);g.arc(0,0,6.5,0,7)},
 mk(){const Rm=11.25*CELL,r=4.75*CELL,geo=new THREE.TorusGeometry(Rm,r,28,72);geo.rotateX(Math.PI/2);
  const p=geo.attributes.position,n=geo.attributes.normal,col=[],ice=new THREE.Color('#ff7fb4'),dough=new THREE.Color('#e3a664');
  for(let i=0;i<p.count;i++){const a=Math.atan2(-p.getZ(i),p.getX(i)),e=.12+.16*Math.sin(7*a+1)+.08*Math.sin(13*a),c=n.getY(i)>e?ice:dough;col.push(c.r,c.g,c.b)}
  geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  const g=new THREE.Group(),sg=new THREE.CylinderGeometry(.011,.011,.055,6),mats=SPR.map(c=>std(c,.5));g.add(mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.42})));
  for(let i=0;i<34;i++){const a=i*2.4,ph=(i*7%9/9-.5)*1.3,rd=new THREE.Vector3(Math.cos(a),0,-Math.sin(a)),t1=new THREE.Vector3(-Math.sin(a),0,-Math.cos(a)),
   t2=rd.clone().multiplyScalar(Math.cos(ph)).addScaledVector(Y,-Math.sin(ph)),s=mesh(sg,mats[i%5],rd.clone().multiplyScalar(Rm+r*Math.sin(ph)).addScaledVector(Y,r*Math.cos(ph)*1.02)),b=i*1.9;
   s.quaternion.setFromUnitVectors(Y,t1.multiplyScalar(Math.cos(b)).addScaledVector(t2,Math.sin(b)).normalize());g.add(s)}
  return g}};
const noodle=col=>({pu:1,dip:.5,cs:[-26,-17.3,-8.7,0,8.7,17.3,26].map(x=>[x,0,3.6]),R:31,ρ:.3,d:.6,lift:.03,fp:(x,y)=>tube(seg(x,y,-26.4,0,26.4,0),3.6),
 sil:g=>g.roundRect(-30,-3.6,60,7.2,3.6),
 mk(){const r=3.6*CELL,l=60*CELL,geo=new THREE.CylinderGeometry(r,r,l,48,1,true),p=geo.attributes.position;
  for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i),k=1+.06*Math.cos(8*Math.atan2(z,x));p.setX(i,x*k);p.setZ(i,z*k)}
  geo.computeVertexNormals();geo.rotateZ(Math.PI/2);
  const m=std(col,.62),g=new THREE.Group(),hole=new THREE.CylinderGeometry(r*.32,r*.32,l,16,1,true);hole.rotateZ(Math.PI/2);
  g.add(mesh(geo,m),mesh(hole,new THREE.MeshStandardMaterial({color:new THREE.Color(col).multiplyScalar(.55),side:THREE.BackSide,roughness:.8})));
  const cap=new THREE.RingGeometry(r*.32,r*1.06,48);for(const s of[-1,1]){const c=mesh(cap,m);c.rotation.y=s*Math.PI/2;c.position.x=s*l/2;g.add(c)}
  return g}});
const chair={pu:.7,dip:1,cs:[[-11,-9,11.5],[-11,9,11.5],[10,-9,11.5],[10,9,11.5]],R:30,ρ:.4,d:1,lift:.07,
 fp:(x,y)=>{let v=x>-17&&x<20&&Math.abs(y)<12.5?.35:0;for(const t of TUBES)v=Math.max(v,tube(seg(x,y,...t),t[4]));return v},
 sil:g=>g.roundRect(-23.6,-20.2,45.4,40.4,6),
 mk(){const g=new THREE.Group(),tm=std('#ffc23a',.32);
  for(const[a,b,c,d,r]of TUBES)g.add(capsule(a,b,c,d,r,tm));
  const x0=-17*CELL,y0=-12.5*CELL,w=37*CELL,h=25*CELL,rr=5*CELL,sh=new THREE.Shape();
  sh.moveTo(x0+rr,y0);sh.lineTo(x0+w-rr,y0);sh.quadraticCurveTo(x0+w,y0,x0+w,y0+rr);sh.lineTo(x0+w,y0+h-rr);sh.quadraticCurveTo(x0+w,y0+h,x0+w-rr,y0+h);
  sh.lineTo(x0+rr,y0+h);sh.quadraticCurveTo(x0,y0+h,x0,y0+h-rr);sh.lineTo(x0,y0+rr);sh.quadraticCurveTo(x0,y0,x0+rr,y0);
  const seat=new THREE.ExtrudeGeometry(sh,{depth:.03,bevelEnabled:true,bevelThickness:.015,bevelSize:.015,bevelSegments:3});seat.rotateX(-Math.PI/2);
  const st=canvasTex(64,4,c=>{c.fillStyle='#fbf3df';c.fillRect(0,0,64,4);c.fillStyle='#ffd166';c.fillRect(0,0,26,4)});st.wrapS=st.wrapT=THREE.RepeatWrapping;st.repeat.set(1/.22,1);
  g.add(mesh(seat,new THREE.MeshStandardMaterial({map:st,roughness:.35}),new THREE.Vector3(0,-.05,0)));
  const cup=new THREE.CylinderGeometry(.07,.07,.02,24);for(const s of[-1,1])g.add(mesh(cup,std('#b98a1c',.6),lv(13,16*s,.165)));
  return g}};
const toys=[[chair,.7,.36,.4],[ring,.27,.64,0],[noodle('#ff5fa2'),.36,.27,-.25],[noodle('#b3df45'),.83,.77,1.1],[ball,.53,.72,0]].map(([k,u,v,a])=>{
 let m=0,I=0;for(const[x,y,r]of k.cs){const q=r*r*k.ρ;m+=q;I+=q*(r*r/2+x*x+y*y)}
 return{...k,a,x:u*gw,y:v*gh,vx:0,vy:0,w:0,z:0,vz:0,m,I,n:new THREE.Vector3(0,1,0),q:new THREE.Quaternion()};
});

// ---------- water simulation (height A, vertical velocity V) ----------
// The second term is viscosity, so fine chop dies out faster than long swells. Edges copy their inner neighbour,
// so water rises and falls against the walls and waves reflect without flipping.
function step(){
 for(let y=1;y<gh-1;y++)for(let x=1,i=y*gw+1;x<gw-1;x++,i++)
  V[i]=(V[i]+.4*(A[i-1]+A[i+1]+A[i-gw]+A[i+gw]-4*A[i])+.025*(V[i-1]+V[i+1]+V[i-gw]+V[i+gw]-4*V[i]))*.996;
 for(let i=0;i<A.length;i++)A[i]+=V[i];
 for(let y=0;y<gh;y++){A[y*gw]=A[y*gw+1];A[y*gw+gw-1]=A[y*gw+gw-2]}
 for(let x=0;x<gw;x++){A[x]=A[gw+x];A[(gh-1)*gw+x]=A[(gh-2)*gw+x]}
}
// Each toy pushes water by the change in its footprint: water rises where it arrives, falls where it left,
// and rings out in the toy's own shape when it bobs (z = how far it's pushed under).
function stamp(t){
 const zs=Math.max(0,1+t.z),moved=!t.bi||Math.abs(t.x-t.px)+Math.abs(t.y-t.py)+Math.abs(t.a-t.pa)*t.R>.08;
 if(!moved&&Math.abs(zs-t.zs)<.002)return;
 let bi=t.bi,bv=t.bv;
 if(moved){
  t.px=t.x;t.py=t.y;t.pa=t.a;bi=[];bv=[];
  const co=Math.cos(t.a),si=Math.sin(t.a);
  for(let y=Math.max(1,t.y-t.R|0);y<=Math.min(gh-2,t.y+t.R+1|0);y++)for(let x=Math.max(1,t.x-t.R|0);x<=Math.min(gw-2,t.x+t.R+1|0);x++){
   const dx=x-t.x,dy=y-t.y,v=t.fp(dx*co+dy*si,dy*co-dx*si);if(v>.01){bi.push(y*gw+x);bv.push(v*t.d*.65)}}
 }
 if(t.bi){t.bi.forEach((i,k)=>A[i]-=t.bv[k]*t.zs);bi.forEach((i,k)=>A[i]+=bv[k]*zs)}
 t.bi=bi;t.bv=bv;t.zs=zs;
}
function drop(x,y,r,s){
 for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){const q=Math.hypot(i,j)/r,X=Math.round(x+i),Y=Math.round(y+j);
  if(q<1&&X>0&&Y>0&&X<gw-1&&Y<gh-1)A[Y*gw+X]-=s*(1+Math.cos(q*Math.PI))/2}
}

function splash(x,y){
 drop(x,y,7,2);emit(x,y,1.2,null);wake();
}
const dunk=t=>{t.vz+=9;emit(t.x,t.y,.5*t.R/20,t,t.R*.7)};


// ---------- toy physics ----------
const DT=1/120,LD=Math.exp(-.8*DT),AD=Math.exp(-1.5*DT),GS=150,WS=70,KW=210,FLD=Math.exp(-2*DT),IMG=[-1,0,1].flatMap(a=>[-1,0,1].map(b=>[a,b]));
let simT=0;const waves=[];
// Wave pushes are tracked as expanding rings (a splash, a dunk, or a moving toy's wake) that sweep outward at the
// water's wave speed. A toy only feels rings it didn't make itself, so its own wake can't push it along.
const emit=(x,y,a,src,r0=0)=>{waves.push({x,y,a,src,r0,t0:simT});if(waves.length>28)waves.shift()};
function hitc(a,b,px,py,nx,ny,pen,k=.8,fresh=true){
 const ia=1/a.m,ib=b?1/b.m:0,s=pen/(ia+ib)*k,rax=px-a.x,ray=py-a.y,rbx=b?px-b.x:0,rby=b?py-b.y:0;
 a.x+=nx*s*ia;a.y+=ny*s*ia;if(b){b.x-=nx*s*ib;b.y-=ny*s*ib}
 const vx=a.vx-a.w*ray-(b?b.vx-b.w*rby:0),vy=a.vy+a.w*rax-(b?b.vy+b.w*rbx:0),vn=vx*nx+vy*ny;
 if(vn>=0)return;
 const em=(tx,ty)=>{const ca=rax*ty-ray*tx,cb=rbx*ty-rby*tx;return ia+ib+ca*ca/a.I+(b?cb*cb/b.I:0)},
  app=(tx,ty,j)=>{a.vx+=j*tx*ia;a.vy+=j*ty*ia;a.w+=(rax*ty-ray*tx)*j/a.I;if(b){b.vx-=j*tx*ib;b.vy-=j*ty*ib;b.w-=(rbx*ty-rby*tx)*j/b.I}};
 // bounce only on real impacts; slow contacts just stop (plus a little friction), so toys rest calmly against walls
 const jn=-(fresh&&vn<-25?1.35:1)*vn/em(nx,ny);app(nx,ny,jn);   // only a new contact bounces
 app(-ny,nx,clamp((vx*ny-vy*nx)/em(-ny,nx),-.3*jn,.3*jn));
}
const world=t=>{const co=Math.cos(t.a),si=Math.sin(t.a);return t.cs.map(([x,y,r])=>[t.x+x*co-y*si,t.y+x*si+y*co,r])};
let grab=null,selT=null,trail=[],touching=new Set();
function phys(){
 for(const t of toys){
  const co=Math.cos(t.a),si=Math.sin(t.a);let fx=0,fy=0,tq=0,hc=0;
  const push=(rx,ry,Fx,Fy)=>{fx+=Fx;fy+=Fy;tq+=rx*Fy-ry*Fx};
  if(t.bi&&t.bi.length){
   // gentle rocking from the local surface slope, and the average water height for bobbing
   let sw=0,Fx=0,Fy=0,T=0;
   for(let k=0;k<t.bi.length;k++){const i=t.bi[k],w=t.bv[k],gx=(A[i+1]-A[i-1])/2,gy=(A[i+gw]-A[i-gw])/2,x=i%gw-t.x,y=(i/gw|0)-t.y;
    Fx-=gx*w;Fy-=gy*w;T-=(x*gy-y*gx)*w;hc+=A[i]*w;sw+=w}
   let k=t.m*t.pu*GS/sw;fx+=Fx*k;fy+=Fy*k;tq+=T*k;hc/=sw;t.sgx=-Fx/sw;t.sgy=-Fy/sw;
   // passing rings shove whichever parts of the toy they're crossing: bigger rings push harder, and a ring
   // catching one end of a long toy turns it. Wall bounces are rings from mirror-image sources across each wall
   // (and corner); a toy never feels the direct ring it made itself, but can be hit by its own echo.
   for(const ev of waves){
    const age=simT-ev.t0,r=ev.r0+age*WS,a0=ev.a*Math.exp(-.7*age)/Math.sqrt(1+r/8);
    if(a0<.02)continue;
    for(const[mx,my]of IMG){
     if(!mx&&!my&&ev.src===t)continue;
     const ox=mx<0?-ev.x:mx>0?2*(gw-1)-ev.x:ev.x,oy=my<0?-ev.y:my>0?2*(gh-1)-ev.y:ev.y,amp=a0*.8**(!!mx+!!my);
     if(Math.abs(len(t.x-ox,t.y-oy)-r)>t.R+15)continue;

 SUN=[C(1,.96,.88),C(1.1,.64,.38),C(.16,.2,.3)],ZEN=[C(.2,.45,.85),C(.24,.28,.55),C(.012,.02,.05)],HOR=[C(.74,.85,.95),C(1,.64,.42),C(.035,.055,.09)];
function setTime(v){
 dirty=true;T.value=v;const N=ss(.4,.95,v),K=Math.exp(-(((v-.5)/.17)**2)),el=(55-51*ss(0,.62,v))*Math.PI/180;
 const pick=a=>mixC(mixC(a[0],a[1],K),a[2],N);
 U.N.value=N;U.sunCol.value.copy(pick(SUN));U.skyZ.value.copy(pick(ZEN));U.skyH.value.copy(pick(HOR));
 U.sunDir.value.set(-.6*Math.cos(el),Math.sin(el),-.8*Math.cos(el)).lerp(new THREE.Vector3(.45,.8,.4),N).normalize();
 sunL.position.copy(U.sunDir.value).multiplyScalar(50);sunL.color.copy(U.sunCol.value);sunL.intensity=.85;
 hemi.color.copy(U.skyZ.value).lerp(C(1,1,1),.55*(1-N));hemi.groundColor.copy(mixC(C(.55,.53,.5),C(.1,.42,.48),N));hemi.intensity=.42+.5*N;
 scene.fog.color.copy(U.skyH.value);
 const r=document.documentElement.style,hx='#'+U.skyH.value.getHexString();
 r.setProperty('--bg',hx);r.setProperty('--ink',N>.45?'#b9d0d6':'#2e3d43');r.setProperty('--panel',N>.45?'#0b131b99':'#ffffffa6');
 T.setAttribute('aria-valuetext',v<.3?'Midday':v<.75?'Sunset':'Night');
}
// Graphics: render resolution, water mesh detail and shading extras. Physics and waves are identical at every level.
const GFX=['Low','Medium','High','Max'];let toastT;
function toast(m){hint.textContent=m;hint.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>hint.style.opacity=0,1500)}
function setQuality(q,say){
 dirty=true;q=clamp(Math.round(q),0,3);GQ.value=q;GQ.setAttribute('aria-valuetext',GFX[q]);U.Qu.value=q;
 const dpr=devicePixelRatio||1;R3.setPixelRatio(Math.min(dpr,[.6,1,1.5,2][q]));R3.setSize(cv.clientWidth,cv.clientHeight,false);
 const k=[3,2,1,1][q];if(water.userData.k!==k){water.geometry.dispose();water.geometry=waterGeo(k);water.userData.k=k}
 if(say)toast('Graphics: '+GFX[q]);
 try{localStorage.setItem('pool-graphics',q)}catch(e){}
}
GQ.oninput=()=>setQuality(+GQ.value,1);$('toLow').onclick=()=>setQuality(0,1);$('toHigh').onclick=()=>setQuality(3,1);
const setView=v=>{VW.value=v;VW.setAttribute('aria-valuetext',v<.2?'Poolside':v>.9?'Overhead':'Angled');fit()};
const go=(set,el,to)=>still.matches?set(to):anim=[set,+el.value,to,performance.now()];
$('toDay').onclick=()=>go(setTime,T,0);$('toNight').onclick=()=>go(setTime,T,1);
$('toSide').onclick=()=>go(setView,VW,0);$('toTop').onclick=()=>go(setView,VW,1);
T.oninput=()=>{anim=null;setTime(+T.value)};VW.oninput=()=>{anim=null;setView(+VW.value)};
const th=document.documentElement.dataset.theme;
setTime(th==='dark'||(th!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches)?1:0);

// ---------- loop ----------
const qa=new THREE.Quaternion(),qb=new THREE.Quaternion(),tv=new THREE.Vector3();
function place(dt){
 for(const t of toys){
  const[x,z]=G2W(t.x,t.y),m=t.mesh;
  // tilt follows the water's slope, but gently: much less while you're dragging it (its own bow wave would tip it)
  // and never more than ~10°
  const tg=(grab&&grab.t===t?.1:.3)*HS/CELL;let sx=-(t.sgx||0)*tg,sz=(t.sgy||0)*tg;const sl=Math.hypot(sx,sz);if(sl>.18){sx*=.18/sl;sz*=.18/sl}
  tv.set(sx,1,sz).normalize();t.n.lerp(tv,.1).normalize();
  const yT=WY+clamp((t.hc||0)*HS,-.6,.14)+t.lift-t.z*.05;t.yv=t.yv===undefined?yT:t.yv+(yT-t.yv)*.25;   // eased, so it can't jitter
  m.position.set(x,t.yv,z);
  if(t.roll){const vx=t.vx*CELL,vz=-t.vy*CELL,s=Math.hypot(vx,vz);if(s>1e-4){qa.setFromAxisAngle(tv.set(vz,0,-vx).normalize(),s*dt/(8*CELL));t.q.premultiply(qa)}m.quaternion.copy(t.q)}
  else{qa.setFromUnitVectors(Y,t.n);qb.setFromAxisAngle(Y,t.a);m.quaternion.copy(qa).multiply(qb)}
 }
 const sv=!!selT&&document.activeElement===cv;if(sv!==selRing.visible)dirty=true;selRing.visible=sv;
 if(sv){const[x,z]=G2W(selT.x,selT.y);selRing.position.set(x,WY+.02,z);selRing.scale.setScalar(selT.R*CELL*1.05)}
 // redraw only if a toy moved by more than a micrometre
 for(const t of toys){const m=t.mesh,p=m.position,q=m.quaternion,o=t.pv||(t.pv=[]),c=[p.x,p.y,p.z,q.x,q.y,q.z,q.w];
  for(let k=0;k<7;k++)if(Math.abs(c[k]-(o[k]??1e9))>1e-6){dirty=true;t.pv=c;break}}
}
let acc=0,prev=performance.now();
// Everything counts as resting when no toy is held, moving, bobbing or being pushed by a ring.
const resting=()=>!grab&&toys.every(t=>Math.abs(t.vx)+Math.abs(t.vy)<.005&&Math.abs(t.w)<5e-4&&Math.abs(t.vz)<1e-3&&Math.abs(t.z)<2e-3&&Math.abs(t.hs||0)<1e-3)
 &&!waves.some(ev=>ev.a*Math.exp(-.7*(simT-ev.t0))>=.02);
function frame(now){
 const fdt=Math.min(now-prev,50)/1000;acc=Math.min(acc+now-prev,50);prev=now;
 if(anim){const k=Math.min((now-anim[3])/1500,1);anim[0](anim[1]+(anim[2]-anim[1])*k*k*(3-2*k));if(k===1)anim=null}
 // once the water is flat and every toy is still, stop simulating until something is touched
 const idle=waterFlat&&resting();
 while(acc>=DT*1000){if(!idle){phys();toys.forEach(stamp);step();waterDirty=true}simT+=DT;acc-=DT*1000}
 if(waterDirty){
  let mx=0;
  for(let y=0,i=0;y<gh;y++)for(let x=0;x<gw;x++,i++){
   const l=A[x?i-1:i],r=A[x<gw-1?i+1:i],d=A[y?i-gw:i],u=A[y<gh-1?i+gw:i],j=i*4,a=A[i];
   px[j]=128+a*60;px[j+1]=128+(r-l)*150;px[j+2]=128+(u-d)*150;px[j+3]=128+(l+r+d+u-4*a)*200;if(a>mx)mx=a;else if(-a>mx)mx=-a;
  }
  // below 0.0003 every value above rounds to the flat 128, so the water is visibly still: settle it exactly
  if(mx<3e-4){A.fill(0);V.fill(0);waterFlat=true}else waterFlat=false;
  wtex.needsUpdate=true;waterDirty=false;dirty=true;
 }
 // toy footprints (alpha = shadow on the floor, red = how far to push the water down under the toy); only when a toy moved
 if(toys.some(t=>t.x!==t.fx||t.y!==t.fy||t.a!==t.fa)){
  sx.clearRect(0,0,gw,gh);
  for(const t of toys){t.fx=t.x;t.fy=t.y;t.fa=t.a;sx.save();sx.translate(t.x,t.y);sx.rotate(t.a);
   sx.fillStyle='#000';sx.beginPath();t.sil(sx);sx.fill('evenodd');
   sx.fillStyle=`rgb(${t.dip*255|0},0,0)`;sx.beginPath();(t.dipSil||t.sil)(sx);sx.fill('evenodd');sx.restore()}
  stex.needsUpdate=true;dirty=true;
 }
 if(hoverEv){cast(hoverEv);cv.style.cursor=pickToy(onWater())?'grab':'';hoverEv=null}
 place(fdt);
 // the floor's light pattern animates on Medium and up, so those levels draw every frame; otherwise only on change
 if(dirty||(U.Qu.value>0&&!still.matches)){U.T.value=still.matches?0:now/2500;R3.render(scene,cam);dirty=false}
 requestAnimationFrame(frame);
}
// start from the viewer's saved choice, else High on phones/tablets and Max elsewhere
let saved=null;try{saved=localStorage.getItem('pool-graphics')}catch(e){}
setQuality(saved!==null?+saved:matchMedia('(pointer:coarse)').matches?2:3);
addEventListener('resize',resize);resize();
// prepare every shader now (the selection ring's too), so nothing stutters the first time it appears
selRing.visible=true;R3.compile(scene,cam);selRing.visible=false;
requestAnimationFrame(frame);
</script>
